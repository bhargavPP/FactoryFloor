global:
  jwtSecret: "your-super-secret-key-minimum-32-characters-long!"
  jwtIssuer: "FactoryFloor"
  jwtAudience: "FactoryFloor"

postgres:
  image: postgres:16
  password: postgres
  replicas: 1
  storage: 1Gi

rabbitmq:
  image: rabbitmq:3-management
  username: guest
  password: guest
  replicas: 1

mongodb:
  image: mongo:7
  username: admin
  password: admin123
  database: factoryfloor_telemetry
  replicas: 1
  storage: 1Gi
 
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"

    limits:
      memory: "512Mi"
      cpu: "500m"
identityService:
  image: factoryfloor-identity:latest
  replicas: 1
  database: factoryfloor_identity

telemetryService:
  image: factoryfloor-telemetry:latest
  replicas: 1
  database: factoryfloor_telemetry

machineService:
  image: factoryfloor-machine:latest
  replicas: 1
  database: factoryfloor_machines
  hpa:
    minReplicas: 1
    maxReplicas: 5
    cpuThreshold: 50
    memoryThreshold: 70

notificationService:
  image: factoryfloor-notification:latest
  replicas: 1

gateway:
  image: factoryfloor-gateway:latest
  replicas: 1