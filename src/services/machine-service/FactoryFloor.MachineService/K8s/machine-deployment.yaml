apiVersion: apps/v1
kind: Deployment
metadata:
  name: machine-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: machine-service
  template:
    metadata:
      labels:
        app: machine-service
    spec:
      containers:
        - name: machine-service
          image: factoryfloor-machine:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: machine-secrets
                  key: connection-string
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: machine-secrets
                  key: jwt-secret
            - name: Jwt__Issuer
              value: "FactoryFloor"
            - name: Jwt__Audience
              value: "FactoryFloor"